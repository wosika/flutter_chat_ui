name: flutter_chat_ui
publish_to: none
version: 2.11.1
description: >
  Free and open-source chat SDK. Build fast, real-time apps and generative
  AI agents with a high-performance, customizable, cross-platform UI.
homepage: https://flyer.chat
repository: https://github.com/flyerhq/flutter_chat_ui

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

resolution: workspace

dependencies:
  cross_cache: ^1.1.0
  diffutil_dart: ^4.0.1
  flutter:
    sdk: flutter
  flutter_chat_core: ^2.9.0
  provider: ^6.1.5+1
  super_sliver_list: 
    git:
      url: git@github.com:wosika/super_sliver_list.git
      ref: 0b1d7e2fbb5bb95a013f5aa75aa5854458f786c7

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
